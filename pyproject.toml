[project]
name = "lakehouse-demo"
version = "0.1.0"
description = "On-prem CSV -> Azure Blob -> Snowflake Iceberg (Bronze/Silver/Gold) medallion pipeline"
requires-python = ">=3.11"
dependencies = [
  "snowflake-connector-python>=3.10",
  "azure-storage-blob>=12.20",
  "azure-identity>=1.17",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "structlog>=24.1",
  "tenacity>=8.3",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "types-PyYAML"]
airflow = ["apache-airflow>=2.9"]

[project.scripts]
lakehouse = "lakehouse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
lint.extend-ignore = ["B008"]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
